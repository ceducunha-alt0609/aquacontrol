name: Corrige marcador final da barra

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-progress-marker-final.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar solucao final
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, base64
          p=Path('index.html')
          html=p.read_text(encoding='utf-8')
          html=re.sub(r'<style>\s*/\* mobile-progress-cursor-v1 \*/.*?</style>\s*','',html,flags=re.S)
          html=re.sub(r'<style>\s*/\* mobile-progress-cursor-v2 \*/.*?</style>\s*','',html,flags=re.S)
          html=re.sub(r'<style id="mobile-progress-live-marker-v1">.*?</style>\s*<script>.*?</script>\s*','',html,flags=re.S)
          marker='/* mobile-progress-marker-final */'
          if marker not in html:
              css=base64.b64decode('').decode('utf-8')
              html=html.replace('</head>',css+'\n</head>',1)
          p.write_text(html,encoding='utf-8')
          PY
      - name: Limpar temporarios
        run: |
          rm -f progress-inspect.txt progress-exact.txt
          rm -f .github/workflows/inspect-progress-dom.yml .github/workflows/inspect-progress-exact.yml
          rm -f .github/workflows/fix-progress-marker-final.yml
      - name: Commit final
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Faz marcador acompanhar o preenchimento real da barra" || exit 0
          git push
