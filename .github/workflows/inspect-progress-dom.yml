name: Inspeciona barra de progresso

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-progress-dom.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair trechos relevantes
        shell: python
        run: |
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          needles=['hs-hero-prog','hs-prog-pct','hs-hero-prog-fill','hs-progress-cursor-live']
          out=[]
          for needle in needles:
              start=0
              out.append('\n===== '+needle+' =====\n')
              while True:
                  i=html.find(needle,start)
                  if i<0: break
                  a=max(0,i-700); b=min(len(html),i+1200)
                  out.append(html[a:b])
                  out.append('\n---\n')
                  start=i+len(needle)
          Path('progress-inspect.txt').write_text('\n'.join(out),encoding='utf-8')
      - name: Commit inspecao
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add progress-inspect.txt
          git commit -m "Inspeciona estrutura da barra de progresso" || exit 0
          git push
