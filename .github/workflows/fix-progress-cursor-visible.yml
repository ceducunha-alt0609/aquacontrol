name: Corrige cursor barra mobile

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-progress-cursor-visible.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tornar marcador visivel
        shell: python
        run: |
          from pathlib import Path
          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          marker = '/* mobile-progress-cursor-v2 */'
          if marker not in html:
              lines = [
                  '<style>',
                  marker,
                  '@media (max-width:600px){',
                  '  #hs-hero .hs-hero-prog{overflow:visible;position:relative}',
                  '  #hs-hero .hs-hero-prog-fill{position:relative;overflow:visible}',
                  '  #hs-hero .hs-hero-prog-fill::after{content:"";position:absolute;right:-9px;top:50%;transform:translateY(-50%);width:18px;height:18px;border-radius:50%;background:#0b5963;border:3px solid #8cecf3;box-shadow:0 0 0 2px rgba(11,89,99,.28),0 2px 8px rgba(0,0,0,.28);z-index:2}',
                  '  #hs-hero .hs-hero-prog-fill.warn::after{background:#b36a00;border-color:#ffd27a}',
                  '  #hs-hero .hs-hero-prog-fill.crit::after{background:#9f1f1f;border-color:#ffb0b0}',
                  '}',
                  '</style>'
              ]
              css = '\n'.join(lines)
              html = html.replace('</head>', css + '\n</head>', 1)
              path.write_text(html, encoding='utf-8')
      - name: Remover workflow temporario
        run: rm -f .github/workflows/fix-progress-cursor-visible.yml
      - name: Commit da correcao
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-progress-cursor-visible.yml
          git commit -m "Corrige visibilidade do cursor da barra mobile" || exit 0
          git push
