name: Add date insight
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/add-date-insight.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Aplicar insight âmbar
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          old_main='''<input type="date" id="in-termino" onchange="setTermino(this.value)" style="height:34px;padding:0 10px;font-size:12px;border:1.5px solid var(--border);border-radius:var(--r);background:var(--bg2);color:var(--text);font-family:var(--body)">\n <span id="termino-info" style="font-size:12px;flex:1"></span>'''
          new_main='''<input type="date" id="in-termino" oninput="validarDataTerminoInsight(this.value)" onchange="setTermino(this.value)" style="height:34px;padding:0 10px;font-size:12px;border:1.5px solid var(--border);border-radius:var(--r);background:var(--bg2);color:var(--text);font-family:var(--body)">\n <span id="termino-info" style="font-size:12px;flex:1"></span>\n <span id="termino-date-insight" style="display:none;flex:1 1 100%;padding:7px 9px;border-radius:8px;background:var(--amber-l);border:1px solid rgba(215,140,0,.35);color:var(--amber);font-size:11px;font-weight:700;line-height:1.35">⚠️ Confira a data informada.</span>'''
          if s.count(old_main)!=1:
              raise SystemExit(f'Campo in-termino esperado 1x, encontrado {s.count(old_main)}x')
          s=s.replace(old_main,new_main,1)

          marker='''function setTermino(val){'''
          helper='''function validarDataTerminoInsight(val){
  const c=getCiclo(curIdx),inp=document.getElementById('in-termino'),box=document.getElementById('termino-date-insight');
  if(!box||!inp)return;
  box.style.display='none';inp.style.borderColor='';inp.style.boxShadow='';
  if(!c||!val)return;
  let ref=null;
  if(c.lancamentos&&c.lancamentos.length)ref=[...c.lancamentos].sort((a,b)=>a.data.localeCompare(b.data)).slice(-1)[0].data;
  else if(c.leituraAnterior&&c.leituraAnterior.data)ref=c.leituraAnterior.data;
  if(!ref)return;
  const d=diffDias(ref,val);
  let msg='';
  if(d<0)msg='⚠️ Confira a data: ela é anterior à última leitura registrada ('+fmtFull(ref)+').';
  else if(d>45)msg='⚠️ Confira a data: ela está '+d+' dias após a última leitura ('+fmtFull(ref)+'). O período parece fora do padrão.';
  if(msg){box.textContent=msg;box.style.display='block';inp.style.borderColor='var(--amber)';inp.style.boxShadow='0 0 0 3px rgba(215,140,0,.12)';}
}
'''
          if s.count(marker)!=1:
              raise SystemExit(f'setTermino esperado 1x, encontrado {s.count(marker)}x')
          s=s.replace(marker,helper+marker,1)

          old_sab='''<div class="fg"><label>Próxima leitura prevista</label><input type="date" id="sab-prox-leit"></div>'''
          new_sab='''<div class="fg"><label>Próxima leitura prevista</label><input type="date" id="sab-prox-leit" oninput="validarSabespDataInsight(this.value)"><div id="sab-prox-insight" style="display:none;margin-top:6px;padding:7px 9px;border-radius:8px;background:var(--amber-l);border:1px solid rgba(215,140,0,.35);color:var(--amber);font-size:11px;font-weight:700;line-height:1.35">⚠️ Confira a data informada.</div></div>'''
          if s.count(old_sab)!=1:
              raise SystemExit(f'Campo sab-prox-leit esperado 1x, encontrado {s.count(old_sab)}x')
          s=s.replace(old_sab,new_sab,1)

          sab_marker='''function importarContaSabesp(){'''
          sab_helper='''function validarSabespDataInsight(val){
  const box=document.getElementById('sab-prox-insight'),inp=document.getElementById('sab-prox-leit'),at=document.getElementById('sab-data-atual');
  if(!box||!inp)return;
  box.style.display='none';inp.style.borderColor='';inp.style.boxShadow='';
  if(!val)return;
  let ref=at&&at.value?at.value:null;
  const c=getCiclo(curIdx);
  if(!ref&&c&&c.lancamentos&&c.lancamentos.length)ref=[...c.lancamentos].sort((a,b)=>a.data.localeCompare(b.data)).slice(-1)[0].data;
  if(!ref)return;
  const d=diffDias(ref,val);
  let msg='';
  if(d<0)msg='⚠️ Confira a data: a próxima leitura está anterior à leitura atual ('+fmtFull(ref)+').';
  else if(d>45)msg='⚠️ Confira a data: intervalo de '+d+' dias desde a leitura atual. O período parece fora do padrão.';
  if(msg){box.textContent=msg;box.style.display='block';inp.style.borderColor='var(--amber)';inp.style.boxShadow='0 0 0 3px rgba(215,140,0,.12)';}
}
'''
          if s.count(sab_marker)!=1:
              raise SystemExit(f'importarContaSabesp esperado 1x, encontrado {s.count(sab_marker)}x')
          s=s.replace(sab_marker,sab_helper+sab_marker,1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Validar
        shell: bash
        run: |
          grep -q "termino-date-insight" index.html
          grep -q "validarDataTerminoInsight" index.html
          grep -q "sab-prox-insight" index.html
          grep -q "validarSabespDataInsight" index.html
      - name: Gravar e remover workflow temporário
        shell: bash
        run: |
          git config user.name "HidroSmart Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/add-date-insight.yml
          git add index.html
          git commit -m "feat: adicionar insight âmbar para datas de previsão"
          git push origin main
