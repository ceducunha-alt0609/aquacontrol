name: Add date insight
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-date-insight.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Aplicar insight
        run: python .github/scripts/add-date-insight.py
      - name: Validar
        run: |
          grep -q "termino-date-insight" index.html
          grep -q "sab-prox-insight" index.html
      - name: Gravar
        run: |
          git config user.name "HidroSmart Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/add-date-insight.yml .github/scripts/add-date-insight.py
          git add index.html
          git commit -m "feat: adicionar insight ambar para datas de previsao"
          git push origin main
