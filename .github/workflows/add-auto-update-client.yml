name: Atualizacao automatica HidroSmart

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-auto-update-client.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Injetar cliente de atualização
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          html=p.read_text(encoding='utf-8')
          marker='hidrosmart-auto-update-v1'
          if marker not in html:
              script=r'''
<script id="hidrosmart-auto-update-v1">
(function(){
  if(!('serviceWorker' in navigator)) return;
  var reloading=false;
  navigator.serviceWorker.addEventListener('controllerchange',function(){
    if(reloading) return;
    reloading=true;
    window.location.reload();
  });
  function forceUpdate(){
    navigator.serviceWorker.getRegistration('/aquacontrol/').then(function(reg){
      if(!reg) return;
      reg.update();
      if(reg.waiting) reg.waiting.postMessage({type:'SKIP_WAITING'});
      reg.addEventListener('updatefound',function(){
        var nw=reg.installing;
        if(!nw) return;
        nw.addEventListener('statechange',function(){
          if(nw.state==='installed' && navigator.serviceWorker.controller){
            nw.postMessage({type:'SKIP_WAITING'});
          }
        });
      });
    }).catch(function(){});
  }
  window.addEventListener('pageshow',forceUpdate);
  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState==='visible') forceUpdate();
  });
  setTimeout(forceUpdate,1200);
})();
</script>
'''
              html=html.replace('</body>',script+'\n</body>',1)
              p.write_text(html,encoding='utf-8')
          PY

      - name: Remover workflow temporario
        run: rm -f .github/workflows/add-auto-update-client.yml

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/add-auto-update-client.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Forca atualizacao automatica da PWA no mobile"
          git push
