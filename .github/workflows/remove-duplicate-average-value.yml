name: Remove media duplicada do hero

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-duplicate-average-value.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remover valor medio duplicado
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='hidrosmart-hide-duplicate-average-v1'
          if marker not in s:
              css='''\n<style id="hidrosmart-hide-duplicate-average-v1">\n@media (max-width:600px){\n#hs-hero .hs-average-value,\n#hs-hero [data-average-consumption]{display:none!important}\n}\n</style>\n'''
              s=s.replace('</head>',css+'\n</head>',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Remover workflow temporario
        run: rm -f .github/workflows/remove-duplicate-average-value.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/remove-duplicate-average-value.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Remove média duplicada do painel de saúde"
          git push
