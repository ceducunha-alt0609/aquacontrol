name: Inspeciona barra exata

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-progress-exact.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair ocorrencias exatas
        shell: python
        run: |
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          pats=[
            r'<[^>]*hs-hero-prog[^>]*>',
            r'<[^>]*hs-hero-prog-fill[^>]*>',
            r'<[^>]*hs-prog-pct[^>]*>[^<]*',
            r'[^;\n]{0,180}hs-prog-pct[^;\n]{0,220}',
            r'[^;\n]{0,180}hs-hero-prog-fill[^;\n]{0,220}',
            r'[^;\n]{0,180}style\.width[^;\n]{0,220}'
          ]
          out=[]
          for p in pats:
            out.append('PATTERN: '+p)
            for m in re.finditer(p,html,re.I):
              out.append(m.group(0).replace('\n',' '))
            out.append('---')
          Path('progress-exact.txt').write_text('\n'.join(out),encoding='utf-8')
      - name: Commit inspecao
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add progress-exact.txt
          git commit -m "Inspeciona markup e atualizacao da barra" || exit 0
          git push
