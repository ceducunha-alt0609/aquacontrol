name: Corrige marcador dinamico da barra

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-live-progress-marker.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Aplicar marcador dinamico
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          marker = 'mobile-progress-live-marker-v1'
          if marker not in html:
              patch = base64.b64decode('').decode('utf-8')
              html = html.replace('</head>', patch + '\n</head>', 1)
              path.write_text(html, encoding='utf-8')
          PY

      - name: Remover workflow temporario
        run: rm -f .github/workflows/fix-live-progress-marker.yml

      - name: Commit da correcao
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-live-progress-marker.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Faz cursor acompanhar percentual consumido no mobile"
          git push
