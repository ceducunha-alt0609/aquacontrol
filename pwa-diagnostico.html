<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diagnóstico PWA</title><style>body{font-family:Arial,sans-serif;padding:20px;background:#edf4fb;color:#08152a}.ok{color:#087a4a}.bad{color:#b3261e}pre{white-space:pre-wrap;background:#fff;border:1px solid #cde;padding:12px;border-radius:12px}</style><h1>Diagnóstico PWA — AquaControl</h1><pre id="out">Rodando...</pre><script>(async()=>{const out=document.getElementById('out');const log=[];const add=(ok,msg)=>log.push((ok?'✓ ':'✕ ')+msg);add(location.pathname.startsWith('/aquacontrol/'),'Caminho publicado: '+location.pathname+' / esperado: /aquacontrol/');add('serviceWorker' in navigator,'Service Worker suportado');try{const r=await fetch('/aquacontrol/manifest.webmanifest',{cache:'no-store'});add(r.ok,'Manifest HTTP '+r.status);const m=await r.json();add(m.scope==='/aquacontrol/','Manifest scope: '+m.scope);add(m.display==='standalone','Display standalone: '+m.display)}catch(e){add(false,'Erro ao ler manifest: '+e)}try{const reg=await navigator.serviceWorker.register('/aquacontrol/sw.js',{scope:'/aquacontrol/'});add(true,'SW registrado: '+reg.scope)}catch(e){add(false,'Erro SW: '+e)}out.textContent=log.join('
');})();</script></html>
